<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="tubGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2a2a4a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a2e;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="100" cy="100" r="90" fill="url(#tubGrad)" stroke="#e94560" stroke-width="4"/>
  
  <!-- Hot tub base -->
  <ellipse cx="100" cy="130" rx="55" ry="18" fill="#16213e" stroke="#929097" stroke-width="2"/>
  
  <!-- Hot tub water -->
  <ellipse cx="100" cy="125" rx="48" ry="14" fill="#1e3a5f" opacity="0.8"/>
  
  <!-- Hot tub rim -->
  <ellipse cx="100" cy="118" rx="55" ry="18" fill="none" stroke="#c8c5cd" stroke-width="3"/>
  
  <!-- Bubbles -->
  <circle cx="85" cy="122" r="3" fill="#c6c4df" opacity="0.7"/>
  <circle cx="95" cy="118" r="2.5" fill="#c6c4df" opacity="0.6"/>
  <circle cx="108" cy="124" r="3.5" fill="#c6c4df" opacity="0.7"/>
  <circle cx="118" cy="120" r="2" fill="#c6c4df" opacity="0.5"/>
  <circle cx="92" cy="126" r="2" fill="#c6c4df" opacity="0.5"/>
  
  <!-- Steam lines -->
  <path d="M80 95 Q75 80 80 65" fill="none" stroke="#c8c5cd" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <path d="M100 90 Q95 75 100 60" fill="none" stroke="#c8c5cd" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <path d="M120 95 Q115 80 120 65" fill="none" stroke="#c8c5cd" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  
  <!-- Wrench icon -->
  <g transform="translate(142, 50) rotate(45)">
    <path d="M0 0 L8 0 L8 20 L0 20 Z" fill="#e94560" rx="2"/>
    <circle cx="4" cy="24" r="6" fill="#e94560"/>
    <circle cx="4" cy="24" r="3" fill="#1a1a2e"/>
  </g>
</svg>
